# ParticleX 主题配置（覆盖 themes/particlex/_config.yml）
# https://github.com/theme-particlex/hexo-theme-particlex

# 头像
avatar: /images/avatar.jpg

# 首页背景图（多张时随机）
background:
    - /images/background.jpg

# 加载动画
loading: /images/loading.gif

# 分类与标签的可选配色
colors:
    - "#ffa2c4"
    - "#00bcd4"
    - "#03a9f4"
    - "#00a596"
    - "#ff7d73"

# 导航栏图标使用 Font Awesome 6：https://fontawesome.com
menu:
    首页:
        name: house
        theme: solid
        link: /
    关于:
        name: id-card
        theme: solid
        link: /about
    归档:
        name: box-archive
        theme: solid
        link: /archives
    分类:
        name: bookmark
        theme: solid
        link: /categories
    标签:
        name: tags
        theme: solid
        link: /tags

# 首页信息卡片
card:
    enable: true
    description: |
        Wheel turning, everything is ever new

        一个人的世界，两个人的悲伤
    iconLinks:
        GitHub:
            name: github
            theme: brands
            link: https://github.com/HanMingZhou
    friendLinks:

# 页脚
footer:
    since: 2024
    ICP:
        enable: false
        code:
        link:

# Polyfill
polyfill:
    enable: true
    features:
        - default

# 代码高亮（Highlight.js 样式可在 https://highlightjs.org/demo 挑选）
highlight:
    enable: true
    style: github

# KaTeX 数学公式
math:
    enable: false

# 图片点击预览
preview:
    enable: true

# 文章加密（需安装 hexo-helper-crypto）
crypto:
    enable: false

# 归档页搜索（仅搜索标题）
search:
    enable: true

# 字数统计与预计阅读时间（由 hexo-symbols-count-time 计算，参数见 _config.yml）
readTime:
    enable: true

# 访问量统计（Vercount，不蒜子的替代品，无需注册）
visitors:
    enable: true
    src: https://cn.vercount.one/js

# 音乐播放器（APlayer + Meting，id 为歌单/单曲 ID）
music:
    enable: true
    api: https://api.injahow.cn/meting/
    server: netease
    type: playlist
    id: 3778678 # 网易云「飙升榜」，可换成自己的歌单 ID
    fixed: true
    mini: true
    autoplay: false
    lrc: false # 滚动歌词（会浮在页面上，默认关闭）
    volume: 0.7
    order: list
    loop: all
    # 若想固定几首歌（不依赖 Meting 接口），在这里写 url 即可，优先级高于上面的歌单
    audio:

# 评论系统：giscus（GitHub 账号登录，评论存在仓库 Discussions 里）
# 启用前需要：仓库 Settings 打开 Discussions，并安装 https://github.com/apps/giscus
# 然后在 https://giscus.app 生成并把 category / categoryID 填到下面
giscus:
    enable: true
    src: https://giscus.app/client.js
    repo: HanMingZhou/hanmingzhou.github.io
    repoID: R_kgDONMLmTA
    category: Announcements
    categoryID: DIC_kwDONMLmTM4DDnLc
    mapping: pathname
    strict: 0
    reactionsEnabled: 1
    emitMetadata: 0
    inputPosition: bottom
    theme: preferred_color_scheme
    lang: zh-CN

gitalk:
    enable: false
    clientID:
    clientSecret:
    repo:
    owner:
    admin:
    language:
    proxy:

waline:
    enable: false
    serverURL:

twikoo:
    enable: false
    envID:
    region:
    path: location.pathname
    lang:
